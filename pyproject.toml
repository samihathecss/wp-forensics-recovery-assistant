[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[project]
name = "wp-forensics"
version = "0.1.0"
requires-python = ">=3.11"
description = "WP Forensics & Recovery Assistant — investigation tool for WordPress backups"

[project.scripts]
wp-forensics = "wp_forensics.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["wp_forensics*"]
